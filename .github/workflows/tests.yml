name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (Home Assistant test harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component==0.13.366
      - run: cd tests/py && pytest -q -p no:cacheprovider
